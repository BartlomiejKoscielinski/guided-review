[package]
name = "guided-review"
version = "0.1.0"
description = "Guided Review: step-by-step code review with Claude Code"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "GuidedReview"

[lib]
name = "guided_review_lib"
crate-type = ["rlib"]

# ADR-020: the executable is GuidedReview.exe.
[[bin]]
name = "GuidedReview"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
thiserror = "2.0.21"
ts-rs = "12.0.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
tauri-plugin-window-state = "2.5.0"
dirs = "7.0.0"
tracing = "0.1.44"
# NFR-08: fmt layer + Targets filter; the size-rotating, redacting writer is our own (logging/).
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
regex = "1.13.1"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
# CLAUDE.md: no unwrap()/expect() outside tests and app startup (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
